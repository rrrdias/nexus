# Arquivo de configuração específico para ser colocado em:
# /etc/nginx/default.d/nexus.conf

# 1. Frontend (Next.js) - Acessível em https://aplicacao.unievangelica.edu.br/nexus
location /nexus {
    proxy_pass http://localhost:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# 2. Backend (NestJS API) - Acessível em https://aplicacao.unievangelica.edu.br/nexus-api
location /nexus-api/ {
    proxy_pass http://localhost:3001/; # A barra no final remove o prefixo /nexus-api/ ao repassar a rota para o NestJS
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Limite aumentado de upload para importação de CSVs grandes
    client_max_body_size 50M;
}
