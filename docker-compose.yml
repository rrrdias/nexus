services:
  db:
    image: postgres:16-alpine
    container_name: nexus_core_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1213122
      POSTGRES_DB: core_db
    ports:
      - "5433:5432" # Keep 5433 for host access as configured in local .env
    volumes:
      - nexus_core_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d core_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nexus_core_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - apps/backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://admin:1213122@db:5432/core_db
      PORT: 3001
      JWT_SECRET: super_secret_key_nexus_2026_dev_environment
      SEED_ADMIN_PASSWORD: admin
      CRON_SECRET: gerar-uma-chave-aleatoria-para-o-cron-job
    # Automatically push the schema on startup so the database is always in sync!
    command: sh -c "cd apps/backend && npm run db:push -- --force && node dist/main.js"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: nexus_core_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_API_URL: http://backend:3001
      AUTH_SECRET: minha-super-secret-1234567890
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3002/api/auth

volumes:
  nexus_core_db:
