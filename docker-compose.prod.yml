services:
  db:
    image: postgres:16-alpine
    container_name: nexus_core_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: core_db
    ports:
      - "5433:5432" # Production standard port
    volumes:
      - nexus_core_db_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d core_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_network
      - nginx_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nexus_core_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:${DB_PASSWORD}@db:5432/core_db
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Moodle Sync - EaD
      MOODLE_EAD_GRADES_GET_URL: ${MOODLE_EAD_GRADES_GET_URL}
      MOODLE_EAD_GRADES_ATT_URL: ${MOODLE_EAD_GRADES_ATT_URL}
      MOODLE_EAD_PROGRESS_GET_URL: ${MOODLE_EAD_PROGRESS_GET_URL}
      MOODLE_EAD_PROGRESS_ATT_URL: ${MOODLE_EAD_PROGRESS_ATT_URL}
      # Moodle Sync - UNI
      MOODLE_UNI_GRADES_GET_URL: ${MOODLE_UNI_GRADES_GET_URL}
      MOODLE_UNI_GRADES_ATT_URL: ${MOODLE_UNI_GRADES_ATT_URL}
      MOODLE_UNI_PROGRESS_GET_URL: ${MOODLE_UNI_PROGRESS_GET_URL}
      MOODLE_UNI_PROGRESS_ATT_URL: ${MOODLE_UNI_PROGRESS_ATT_URL}
      # Moodle Sync - UNIEGO
      MOODLE_UNIEGO_GRADES_GET_URL: ${MOODLE_UNIEGO_GRADES_GET_URL}
      MOODLE_UNIEGO_GRADES_ATT_URL: ${MOODLE_UNIEGO_GRADES_ATT_URL}
      MOODLE_UNIEGO_PROGRESS_GET_URL: ${MOODLE_UNIEGO_PROGRESS_GET_URL}
      MOODLE_UNIEGO_PROGRESS_ATT_URL: ${MOODLE_UNIEGO_PROGRESS_ATT_URL}
      # Moodle Sync - Raizes
      MOODLE_RAIZES_GRADES_GET_URL: ${MOODLE_RAIZES_GRADES_GET_URL}
      MOODLE_RAIZES_GRADES_ATT_URL: ${MOODLE_RAIZES_GRADES_ATT_URL}
      MOODLE_RAIZES_PROGRESS_GET_URL: ${MOODLE_RAIZES_PROGRESS_GET_URL}
      MOODLE_RAIZES_PROGRESS_ATT_URL: ${MOODLE_RAIZES_PROGRESS_ATT_URL}
      # Moodle Sync - EEFN
      MOODLE_EEFN_GRADES_GET_URL: ${MOODLE_EEFN_GRADES_GET_URL}
      MOODLE_EEFN_GRADES_ATT_URL: ${MOODLE_EEFN_GRADES_ATT_URL}
      MOODLE_EEFN_PROGRESS_GET_URL: ${MOODLE_EEFN_PROGRESS_GET_URL}
      MOODLE_EEFN_PROGRESS_ATT_URL: ${MOODLE_EEFN_PROGRESS_ATT_URL}
      # Moodle Sync - Pós Graduação
      MOODLE_POS_GRADES_GET_URL: ${MOODLE_POS_GRADES_GET_URL}
      MOODLE_POS_GRADES_ATT_URL: ${MOODLE_POS_GRADES_ATT_URL}
      # Lyceum SQL Server Connection (Academic Module)
      LYCEUM_DB_HOST: ${LYCEUM_DB_HOST}
      LYCEUM_DB_PORT: ${LYCEUM_DB_PORT}
      LYCEUM_DB_DATABASE: ${LYCEUM_DB_DATABASE}
      LYCEUM_DB_USERNAME: ${LYCEUM_DB_USERNAME}
      LYCEUM_DB_PASSWORD: ${LYCEUM_DB_PASSWORD}
      LYCEUM_DB_PREFIX: ${LYCEUM_DB_PREFIX}
    command: sh -c "cd apps/backend && npm run db:push -- --force && node dist/main.js"
    networks:
      - nexus_network
      - nginx_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_BASE_PATH: "/nexus"
    container_name: nexus_core_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_API_URL: http://backend:3001
      NEXT_BASE_PATH: "/nexus"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL}
    networks:
      - nexus_network
      - nginx_network

volumes:
  nexus_core_db_prod:

networks:
  nexus_network:
    name: nexus_core_network
    driver: bridge
  nginx_network:
    external: true